name: Build Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Patch source for modern Boost and fmt
        shell: pwsh
        run: |
          $files = Get-ChildItem src -Recurse -Include *.h,*.cpp
          foreach ($f in $files) {
            $t = Get-Content $f.FullName -Raw
            $o = $t
            $t = $t -replace 'boost::asio::io_context::work\s+work\{io_context\};', 'boost::asio::executor_work_guard<boost::asio::io_context::executor_type> work{io_context.get_executor()};'
            $t = $t -replace 'boost::asio::io_service', 'boost::asio::io_context'
            $t = $t -replace 'io_service::work', 'io_context::work'
            $t = $t -replace '\.expires_from_now\(', '.expires_after('
            $t = $t -replace 'boost::asio::ip::address_v4::from_string\(([^)]*)\)', 'boost::asio::ip::make_address_v4($1)'
            $t = $t -replace 'address_v4::from_string\(([^)]*)\)', 'boost::asio::ip::make_address_v4($1)'
            $t = $t -replace '\bio_service\b', 'io_context'
            $t = $t -replace '\bio_context\.post\((.*)\)\);', 'boost::asio::post(io_context, $1));'
            $t = $t -replace 'fmt::format\("\{:d\}, \{\}, \{:s\}", house->getId\(\), (GUEST_LIST|SUBOWNER_LIST), ', 'fmt::format("{:d}, {}, {:s}", house->getId(), static_cast<int>($1), '
            if ($f.Name -eq 'connection.cpp') { $t = $t -replace '\.to_ulong\(\)', '.to_uint()' }
            if ($t -ne $o) { Set-Content -Path $f.FullName -Value $t -NoNewline; Write-Host "patched $($f.Name)" }
          }

      - name: Write vcpkg manifest
        shell: pwsh
        run: |
          $json = @'
          {
            "name": "tfs",
            "version": "1.0.0",
            "dependencies": [
              "boost-asio", "boost-iostreams", "boost-system", "boost-filesystem",
              "boost-variant", "boost-lockfree", "boost-date-time", "boost-regex",
              "boost-thread", "luajit", "libmariadb", "pugixml", "cryptopp", "fmt"
            ]
          }
          '@
          Set-Content -Path vcpkg.json -Value $json -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          $vc = $env:VCPKG_INSTALLATION_ROOT
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$vc/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DCMAKE_BUILD_TYPE=Release -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Show errors
        if: failure()
        shell: pwsh
        run: Select-String -Path build.log -Pattern 'error' | Select-Object -First 40 | ForEach-Object { $_.Line }

      - name: Collect files
        shell: pwsh
        run: |
          mkdir out
          Copy-Item build\Release\*.exe out\
          Copy-Item build\Release\*.dll out\ -ErrorAction SilentlyContinue
          Copy-Item data out\data -Recurse
          Copy-Item config.lua.dist, key.pem, schema.sql out\

      - uses: actions/upload-artifact@v4
        with:
          name: tfs-860-windows
          path: out
